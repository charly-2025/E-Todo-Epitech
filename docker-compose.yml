services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: etodo_user
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # <=== ici, identique au root
    ports:
      - "3307:3306"
    volumes:
      - ./e-todo.sql:/docker-entrypoint-initdb.d/init.sql
      - etodo-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "etodo_user", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s


  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: etodo_user
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: etodo_pass
      PORT: ${PORT}
      SECRET: ${SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network
    restart: on-failure
    command: >
      sh -c "until mysqladmin ping -h mysql --silent; do echo 'wait mysql';
          sleep 2; done; npm start"
  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

volumes:
  etodo-data:

networks:
  app-network:
    driver: bridge
